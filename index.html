<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #e4e6ea;
    display: flex; justify-content: center;
    font-family: Roboto, "Segoe UI", Arial, sans-serif;
    user-select: none;
  }

  .app {
    width: 100%; max-width: 420px; height: 100%; max-height: 820px;
    background: #f1f2f5;
    display: flex; flex-direction: column;
    padding: 0 10px calc(12px + env(safe-area-inset-bottom));
  }

  /* title bar */
  .bar { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; color: #1c1c1e; }
  .bar h1 { margin: 0; font-size: 1.05rem; font-weight: 500; }
  .bar .dots { font-size: 1.5rem; line-height: 1; }

  /* green display */
  .display {
    background: #c6dcab;
    border-radius: 14px;
    height: 22%; min-height: 110px;
    padding: 0 18px;
    display: flex; align-items: center; justify-content: flex-end;
    overflow: hidden;
  }
  #screen { font-size: 4.6rem; font-weight: 300; color: #4d5b47; white-space: nowrap; }

  /* keys */
  .pad {
    flex: 1; min-height: 0; margin-top: 14px;
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr); gap: 9px;
  }
  button.key {
    font: inherit; font-size: 1.6rem; color: #1c1c1e;
    border: 0; border-radius: 14px; cursor: pointer;
    background: #c9ccda;
  }
  button.key:active { filter: brightness(.88); }
  button.key.o { background: #ffa347; }
  button.key:focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; }

  @media (max-height: 560px) { #screen { font-size: 3.2rem; } button.key { font-size: 1.25rem; } }
</style>
</head>
<body>
<main class="app">
  <div class="bar"><h1>Calculator</h1><span class="dots" aria-hidden="true">⋮</span></div>
  <div class="display" aria-live="polite"><span id="screen">0</span></div>

  <div class="pad" id="pad">
    <button class="key o" data-a="clear">C</button>
    <button class="key o" data-a="sign">+/-</button>
    <button class="key o" data-a="del">Del</button>
    <button class="key o" data-a="op" data-v="/" aria-label="Divide">÷</button>

    <button class="key" data-a="num" data-v="7">7</button>
    <button class="key" data-a="num" data-v="8">8</button>
    <button class="key" data-a="num" data-v="9">9</button>
    <button class="key o" data-a="op" data-v="*" aria-label="Multiply">×</button>

    <button class="key" data-a="num" data-v="4">4</button>
    <button class="key" data-a="num" data-v="5">5</button>
    <button class="key" data-a="num" data-v="6">6</button>
    <button class="key o" data-a="op" data-v="-" aria-label="Subtract">−</button>

    <button class="key" data-a="num" data-v="1">1</button>
    <button class="key" data-a="num" data-v="2">2</button>
    <button class="key" data-a="num" data-v="3">3</button>
    <button class="key o" data-a="op" data-v="+" aria-label="Add">+</button>

    <button class="key" data-a="num" data-v="0">0</button>
    <button class="key" data-a="num" data-v="00">00</button>
    <button class="key" data-a="dot" aria-label="Decimal point">.</button>
    <button class="key o" data-a="equals" aria-label="Equals">=</button>
  </div>
</main>

<script>
  const screen = document.getElementById("screen");

  let current = "0";      // number shown on screen
  let previous = null;    // first number of the pending operation
  let operator = null;    // + - * /
  let waiting = false;    // next digit starts a new number
  let lastOp = null, lastOperand = null;   // so pressing = again repeats the operation
  const MAX_DIGITS = 12;

  function calc(a, op, b) {
    a = parseFloat(a); b = parseFloat(b);
    const r = op === "+" ? a + b : op === "-" ? a - b : op === "*" ? a * b : b === 0 ? NaN : a / b;
    return clean(r);
  }

  function clean(n) {
    if (!isFinite(n)) return "Error";
    if (n !== 0 && (Math.abs(n) >= 1e12 || Math.abs(n) < 1e-7))
      return n.toExponential(5).replace(/\.?0+e/, "e").replace("e+", "e");
    return String(parseFloat(n.toPrecision(12)));
  }

  function withCommas(s) {
    if (s === "Error" || s.includes("e")) return s;
    const neg = s.startsWith("-") ? "-" : "";
    const [int, dec] = s.replace("-", "").split(".");
    return neg + int.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + (dec !== undefined ? "." + dec : "");
  }

  function render() {
    const text = withCommas(current);
    screen.textContent = text;
    const size = text.length <= 8 ? 4.6 : text.length <= 10 ? 3.7 : text.length <= 13 ? 3 : 2.3;
    screen.style.fontSize = size + "rem";
  }

  const digits = (s) => s.replace(/[-.]/g, "").length;

  function inputNum(d) {
    if (current === "Error") current = "0";
    if (waiting) { current = "0"; waiting = false; }
    if (current === "0") current = d === "00" ? "0" : d;
    else if (current === "-0") current = d === "00" ? "-0" : "-" + d;
    else if (digits(current) + d.length <= MAX_DIGITS) current += d;
    render();
  }

  function inputDot() {
    if (current === "Error") current = "0";
    if (waiting) { current = "0."; waiting = false; }
    else if (!current.includes(".") && !current.includes("e")) current += ".";
    render();
  }

  function chooseOp(op) {
    if (current === "Error") return;
    if (operator && !waiting) {
      current = calc(previous, operator, current);
      if (current === "Error") { clearAll("Error"); return; }
    }
    previous = current; operator = op; waiting = true; lastOp = null;
    render();
  }

  function equals() {
    if (current === "Error") return;
    if (operator) {
      const second = waiting && lastOperand !== null ? lastOperand : current;
      const result = calc(previous, operator, second);
      lastOp = operator; lastOperand = second;
      current = result; previous = null; operator = null; waiting = true;
      if (result === "Error") { lastOp = null; lastOperand = null; waiting = false; }
    } else if (lastOp) {
      current = calc(current, lastOp, lastOperand);
      waiting = true;
    }
    render();
  }

  function toggleSign() {
    if (current === "Error") return;
    if (waiting) { current = "0"; waiting = false; }
    current = current.startsWith("-") ? current.slice(1) : current === "0" ? "-0" : "-" + current;
    render();
  }

  function del() {
    if (waiting || current === "Error") return;
    current = current.length > 1 && current !== "-0" ? current.slice(0, -1) : "0";
    if (current === "-") current = "0";
    render();
  }

  function clearAll(value) {
    current = value || "0"; previous = null; operator = null; waiting = false; lastOp = null; lastOperand = null;
    render();
  }

  document.getElementById("pad").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const a = b.dataset.a;
    if (a === "num") inputNum(b.dataset.v);
    else if (a === "dot") inputDot();
    else if (a === "op") chooseOp(b.dataset.v);
    else if (a === "equals") equals();
    else if (a === "clear") clearAll();
    else if (a === "sign") toggleSign();
    else if (a === "del") del();
  });

  // Keyboard support
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (/^[0-9]$/.test(k)) inputNum(k);
    else if (k === "." || k === ",") inputDot();
    else if (["+", "-", "*", "/"].includes(k)) { e.preventDefault(); chooseOp(k); }
    else if (k === "x" || k === "X") chooseOp("*");
    else if (k === "Enter" || k === "=") { e.preventDefault(); equals(); }
    else if (k === "Backspace") del();
    else if (k === "Escape" || k === "c" || k === "C") clearAll();
  });

  render();
</script>
</body>
</html>
